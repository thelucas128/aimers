[package]
name = "aimers"
description = "Headless environment logger for Roblox scripts, running on rustudio's engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aimers"
path = "src/main.rs"

[dependencies]
rustudio-core = { path = "../rustudio-core" }
rustudio-engine = { path = "../rustudio-engine" }
mlua = { version = "0.12", features = ["luau"] }
rbx_dom_weak = "4"
serde_json = "1"
